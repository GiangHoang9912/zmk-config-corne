# ######################################################
## General

# Change board name
CONFIG_ZMK_KEYBOARD_NAME="T'scornes"

### Power
CONFIG_ZMK_SLEEP=y # Enable deep sleep support
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ######################################################
## Split Keyboard (Cải thiện kết nối 2 nửa)
# Bật báo pin của nửa còn lại sang nửa chính
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ######################################################
## OLED Display
CONFIG_ZMK_DISPLAY=y

# Dùng Work Queue riêng cho OLED để chống crash (Đặc biệt quan trọng trên nice!nano v2)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Bật hiển thị các Widget cơ bản
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# WPM bật lại 2026-08-28 (trước tắt vì sợ nghẽn I2C). Nếu OLED chớp/treo thì đổi về n.
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Bật lại EXT_POWER (Nếu tắt, màn hình có thể bị mất điện nguồn)
CONFIG_ZMK_EXT_POWER=y

# ######################################################
## Output: PHẢI khai báo rõ ràng (2026-08-28)
# app/Kconfig của ZMK: `config ZMK_USB` và `menuconfig ZMK_BLE` KHÔNG có
# `default y`. Thiếu hai dòng này thì firmware enumerate USB được nhưng
# không đăng ký HID interface nào -> bàn phím câm hoàn toàn.
# Đã kiểm chứng: thêm CONFIG_ZMK_USB=y -> hidutil thấy 0x1d50 T'scornes
# (UsagePage 1 / Usage 6 = Keyboard) và gõ được qua dây.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# ######################################################
## Battery: khai báo rõ ràng (2026-08-28)
# Pin hiện 0% dù cell còn điện (rút dây bật công tắc bàn phím vẫn chạy).
# app/Kconfig: ZMK_BATTERY_REPORTING chỉ được `imply` từ ZMK_BLE (gợi ý yếu),
# và fetch mode là một choice — nice!nano đo bằng voltage divider nên phải
# chọn LITHIUM_VOLTAGE, không phải STATE_OF_CHARGE (dành cho IC fuel gauge).
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y
