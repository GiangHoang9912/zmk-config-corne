# Corne v4 + nRF52840 (nice!nano) — cấu hình sạch, 2026-08-28
# Chỉ giữ những gì đã kiểm chứng bằng thực nghiệm trong phiên gỡ lỗi.

# ── Tên bàn phím ─────────────────────────────────────────
CONFIG_ZMK_KEYBOARD_NAME="T'scornes"

# ── Kết nối: BẮT BUỘC khai báo ───────────────────────────
# ZMK khai `config ZMK_USB` và `menuconfig ZMK_BLE` KHÔNG có `default y`.
# Thiếu hai dòng này thì bàn phím câm hoàn toàn: enumerate USB đúng tên
# nhưng không đăng ký HID interface nào (hidutil không thấy 0x1d50).
# Đây là nguyên nhân gốc của cả buổi gỡ lỗi 27-28/08.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── Nguồn ────────────────────────────────────────────────
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ── Màn hình OLED ────────────────────────────────────────
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# ── ĐỪNG THÊM LẠI (đã kiểm chứng là gây hỏng) ────────────
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
#   Ba dòng này thêm ở commit 568e920 để "optimize OLED stability".
#   Thực tế chúng làm NỬA PHẢI crash: bật OLED là nửa phải chết, không gõ được.
#   Bỏ đi thì OLED bật mà hai bên vẫn gõ tốt.
#
# CONFIG_ZMK_BATTERY_REPORTING=y
#   Đã thử, không ăn. Log USB ở mức debug chạy 4 phút không có nổi một dòng
#   từ driver battery => board thiếu mạch chia áp VDDH, phần mềm không đọc
#   được pin. Pin luôn hiện 0%. Đây là hạn chế phần cứng.
