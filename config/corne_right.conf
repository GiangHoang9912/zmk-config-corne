# Cấu hình riêng cho NỬA PHẢI (peripheral) — 2026-08-28
# ZMK áp corne.conf cho cả hai nửa; file này ghi đè riêng cho nửa phải.
#
# Nửa phải không boot được / không bắt được liên lạc với nửa trái, trong khi
# nửa trái cùng build thì chạy tốt. Lịch sử repo có 3 commit vật lộn vì OLED
# gây crash (ddaf632, f6e1c40, 568e920), nên tắt OLED cho riêng peripheral:
# nó không cần màn hình để bàn phím gõ được.
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_EXT_POWER=n
