# Cấu hình riêng cho NỬA PHẢI (peripheral) — 2026-08-28
#
# ĐÃ KIỂM CHỨNG BẰNG A/B: OLED làm nửa phải crash.
#   corne_right 355K (DISPLAY=n) -> gõ được
#   corne_right 623K (DISPLAY=y) -> chết, không gõ được
# Nửa trái cùng lúc đó vẫn chạy OLED bình thường, nên đây là vấn đề riêng
# của màn hình / đường I2C bên phải, không phải config sai.
# Khớp với lịch sử repo: ddaf632, f6e1c40, 568e920 đều vật lộn vì OLED crash.
#
# Muốn có màn hình bên phải thì phải sửa phần cứng (hàn lại chân I2C của
# OLED, hoặc thay màn), rồi xoá file này.
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_EXT_POWER=n
