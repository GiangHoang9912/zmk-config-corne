# ######################################################
## General

# Change board name
CONFIG_ZMK_KEYBOARD_NAME="T'scornes"

### Power
CONFIG_ZMK_SLEEP=y # Enable deep sleep support
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ######################################################
## TẠM TẮT ĐỂ CÔ LẬP LỖI (2026-08-27)
# Bàn phím enumerate USB nhưng không tạo được HID interface, OLED trống,
# phím không ăn. Tắt toàn bộ khối OLED + ext_power + split battery proxy
# để xác định bàn phím có gõ được ở cấu hình tối giản không.
# Chạy được thì bật lại từng cái một để tìm thủ phạm.

CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_EXT_POWER=n
