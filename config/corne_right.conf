# Cấu hình riêng cho NỬA PHẢI (peripheral) — 2026-08-28
#
# ĐÃ THỬ ĐỦ 3 TỔ HỢP, kết quả kiểm chứng bằng gõ thật:
#   DISPLAY=n + EXT_POWER=n  -> GÕ ĐƯỢC (không có màn hình)
#   DISPLAY=y + EXT_POWER=y  -> chết, không gõ được
#   DISPLAY=y + EXT_POWER=n  -> chết, không gõ được
#
# Nửa TRÁI chạy OLED bình thường với cùng config chung, nên đây là lỗi
# phần cứng riêng của màn hình / đường I2C bên phải, không phải config.
# Muốn có màn bên phải: hàn lại chân I2C của OLED hoặc thay màn, rồi xoá file này.
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_EXT_POWER=n
