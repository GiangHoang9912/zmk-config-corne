# Cấu hình riêng cho NỬA PHẢI (peripheral) — 2026-08-28
#
# Đã kiểm chứng A/B: OLED + EXT_POWER=y  -> nửa phải crash, không gõ được.
#                     OLED tắt hẳn        -> gõ được nhưng mất màn hình.
#
# Thử tổ hợp thứ ba, lấy từ chính lịch sử repo (commit f6e1c40:
# "re-enable OLED widgets but keep ext_power off to prevent crash"):
# bật màn hình nhưng KHÔNG bật ext_power.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_EXT_POWER=n
